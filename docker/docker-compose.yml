services:
  nginx_main:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: nginx/hw4
    container_name: "nginx_main"
    volumes:
      - ./nginx_confs/nginx_main.conf:/etc/nginx/conf.d/default.conf
    ports:
      - '80:80'
    depends_on:
      - nginx1
      - nginx2
    networks:
      - application_network
    
  nginx1:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: nginx/hw4
    container_name: "nginx1"
    volumes:
      - ./nginx_confs/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./app:/var/www/app
  
    depends_on:
      - app1
      - app2
    networks:
      - application_network

  nginx2:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: nginx/hw4
    container_name: "nginx2"
    volumes:
      - ./nginx_confs/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./app:/var/www/app
   
    depends_on:
      - app1
      - app2
    networks:
      - application_network
  
  app1:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: app/hw4
    container_name: "app1"
    volumes:
      - ./app:/var/www/app
    expose:
      - "9000"
    env_file:
      - .env
    depends_on:
      - redis
      - mariadb
    networks:
      - application_network

  app2:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: app/hw4
    container_name: "app2"
    volumes:
      - ./app:/var/www/app
    expose:
      - "9000"
    env_file:
      - .env
    depends_on:
      - redis
      - mariadb
    networks:
      - application_network

  redis:
    image: redis:8-alpine
    container_name: "redis"
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - application_network

  mariadb:
    image: mariadb:lts
    container_name: mariadb
    expose:
      - "3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    volumes:
      - ./db:/var/lib/mysql
      - ./db_dump/dump.sql:/docker-entrypoint-initdb.d/dump.sql
    networks:
      - application_network

networks:
  application_network:
    driver: bridge
