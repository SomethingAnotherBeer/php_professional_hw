services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: nginx/hw4
    container_name: "nginx"
    volumes:
      - ./app:/var/www/app

    ports:
      - '80:80'
    depends_on:
      - app
    networks:
      - application_network
    
  app:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: app/hw4
    container_name: "app"
    volumes:
      - ./app:/var/www/app
    expose:
      - "9000"
    env_file:
      - .env
    depends_on:
      - redis
      - mariadb
    networks:
      - application_network

  redis:
    image: redis:8-alpine
    container_name: "redis"
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - application_network

  mariadb:
    image: mariadb:lts
    container_name: mariadb
    expose:
      - "3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    volumes:
      - ./db:/var/lib/mysql
 #     - ./db_dump/dump.sql:/docker-entrypoint-initdb.d/dump.sql
    networks:
      - application_network

networks:
  application_network:
    driver: bridge
