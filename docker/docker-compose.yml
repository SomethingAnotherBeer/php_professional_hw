services:
  app:
    build:
      context: ./cli
      dockerfile: Dockerfile
    image: app
    container_name: "app"
    volumes:
      - ./app:/var/www/app
      - ./.env:/env/.env
    expose:
      - "9000"
    networks:
      - application_network

  postgres:
    image: postgres:17-alpine
    expose:
      - "5432"
    container_name: "postgres"
    working_dir: /app
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./db:/var/lib/postgresql/data
      - ./init_data/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - application_network

networks:
  application_network:
    driver: bridge
