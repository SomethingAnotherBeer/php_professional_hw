services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: "nginx"
    volumes:
      - ./app:/var/www/app

    ports:
      - '80:80'
    depends_on:
      - app
    networks:
      - application_network
    
  app:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: app
    container_name: "app"
    volumes:
      - ./app:/var/www/app
      - ./.env:/env/.env
    expose:
      - "9000"
   
    networks:
      - application_network

networks:
  application_network:
    driver: bridge
