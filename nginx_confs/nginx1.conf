upstream fpm_backend {
    least_con;
    server app1:9000;
    server app2:9000;
}

server {
    listen 80;
    index index.php;
    root /var/www/app;


    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_pass fpm_backend;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}